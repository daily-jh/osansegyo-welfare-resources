name = "osan-youth-usage"
main = "worker.mjs"
compatibility_date = "2026-10-21"

[[d1_databases]]
binding = "DB"
database_name = "osan-youth-usage"
database_id = "b92182f9-98fa-4ef7-8f42-a8f471eaeb13"

[observability]
enabled = true


[vars]
# 쉬운 주소(사용자 지정 도메인)를 붙이면 그 주소를 쉼표로 적고 wrangler deploy. 기존 github.io 주소는 코드에서 항상 허용.
# 예: SITE_ORIGINS = "https://example.kr,https://www.example.kr"  (scripts/set-custom-domain.py가 자동으로 채움)
SITE_ORIGINS = ""
