name: OY-RALS core and linkage regression
on:
  push:
    branches: [main]
    paths:
      - 'docs/youth-risk/**'
      - '.github/workflows/oy-rals-v87-regression.yml'
  pull_request:
    paths:
      - 'docs/youth-risk/**'
      - '.github/workflows/oy-rals-v87-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V8.7 safety and goals regression
        run: node docs/youth-risk/tests/v87-safety-goals-regression.cjs
      - name: V8.7 integration regression
        run: node docs/youth-risk/tests/v87-integration-regression.cjs

      - name: V8.8 interpretation and linkage regression
        run: node tests/youth-journey-v88.cjs

      - name: V8.8.1 absolute principles, core and ZIP consistency
        run: node docs/youth-risk/tests/v88-absolute-principles-regression.cjs

      - name: V3 assessment UI, scroll and report contracts
        run: node tests/youth-v3-interface-contract.cjs

      - name: CORE unknown, safety and district routing invariants
        run: node tests/youth-core-routing-invariants.cjs

      - name: OY-CIE V3.2 CORE and dialogue regression
        run: node tests/cie-v32-regression.cjs

      - name: Interpretation semantics and PDF privacy
        run: node tests/youth-interpretation-regression.cjs
