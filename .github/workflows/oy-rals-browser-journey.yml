name: OY-RALS real browser journey regression
on:
  pull_request:
    paths:
      - 'docs/youth-risk/**'
      - 'e2e/youth-ui-browser-regression.cjs'
      - 'e2e/youth-true-user-flow.cjs'
      - 'e2e/youth-review-fixes-flow.cjs'
      - 'e2e/youth-feedback-flow.cjs'
      - 'server/youth-risk-usage/**'
      - '.github/workflows/oy-rals-browser-journey.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/youth-risk/**'
      - 'e2e/youth-ui-browser-regression.cjs'
      - 'e2e/youth-true-user-flow.cjs'
      - 'e2e/youth-review-fixes-flow.cjs'
      - 'e2e/youth-feedback-flow.cjs'
      - 'server/youth-risk-usage/**'
      - '.github/workflows/oy-rals-browser-journey.yml'
permissions:
  contents: read
jobs:
  browser-journey:
    # Playwright 1.56.1 cannot install browsers on ubuntu-latest once it moved to 26.04; pin the last supported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Start static GitHub Pages mirror
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/oy-rals-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/youth-risk/ >/dev/null
      - name: Verify case assessment, plan, map, PDF print on desktop and mobile
        run: node e2e/youth-ui-browser-regression.cjs
      - name: Follow the external review fixes through real clicks
        run: node e2e/youth-review-fixes-flow.cjs
      - name: Validate real user clicks, live AI inference, PDF output and cross-browser interaction
        run: node e2e/youth-true-user-flow.cjs
      - name: Open 05 final report, check decisions, A4 fit, opinion, two-page print and phone layout
        run: node e2e/youth-final-report-flow.cjs
      - name: Choose a grade beside the name and read it in the scale report and 05 without changing decisions
        run: node e2e/youth-grade-lens-flow.cjs
      - name: Open 06 scale library before evaluation, fold cards, filter by grade and return with answers kept
        run: node e2e/youth-scale-library-flow.cjs
      - name: Send a private report and a review that shows only after approval, with personal information blocked
        run: node e2e/youth-feedback-flow.cjs
      - name: Inspect actual A4 PDF document and embedded Korean result text
        run: |
          sudo apt-get install -y poppler-utils
          pdf=artifacts/oy-user-route/chromium-1280-score.pdf
          test -s "$pdf"
          pdfinfo "$pdf" | tee artifacts/oy-user-route/chromium-1280-pdfinfo.txt
          pdfinfo "$pdf" | grep -q 'A4'
          pdftotext -layout "$pdf" artifacts/oy-user-route/chromium-1280-score-extracted.txt
          grep -Eq '영역|점수|평가' artifacts/oy-user-route/chromium-1280-score-extracted.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-oy-rals-browser-screenshots
          path: |
            artifacts/youth-stage-browser/
            artifacts/oy-user-route/
            artifacts/oy-final-report/
          if-no-files-found: ignore
          retention-days: 7
