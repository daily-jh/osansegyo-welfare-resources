name: OY-RALS model contract smoke
on:
  push:
    branches:
      - main
      - 'integration/**'
    paths:
      - 'docs/youth-risk/**'
      - 'tests/oy-model-contract.test.cjs'
      - 'tests/oy-architecture-wiring.cjs'
      - 'tests/oy-decision-chain.cjs'
      - 'tests/oy-constants-drift.cjs'
      - 'tests/fixtures/**'
      - 'tests/youth-five-level-index.cjs'
      - 'tests/youth-result-readout.cjs'
      - 'tests/youth-stage-navigation-regression.cjs'
      - '.github/workflows/oy-rals-model-contract.yml'
  pull_request:
    paths:
      - 'docs/youth-risk/**'
      - 'tests/oy-model-contract.test.cjs'
      - 'tests/oy-architecture-wiring.cjs'
      - 'tests/oy-decision-chain.cjs'
      - 'tests/oy-constants-drift.cjs'
      - 'tests/fixtures/**'
      - 'tests/youth-five-level-index.cjs'
      - 'tests/youth-result-readout.cjs'
      - '.github/workflows/oy-rals-model-contract.yml'
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax
        run: |
          node --check docs/youth-risk/model-gateway-v90.js
          node --check docs/youth-risk/journey-model-v88.js
          node --check docs/youth-risk/journey-v88.js
          node --check docs/youth-risk/integrated-index-v1.js
          node --check docs/youth-risk/stage-insights-v1.js
          node --check docs/youth-risk/result-readout-v1.js
          node --check docs/youth-risk/oy-item-knowledge-v1.js
          node --check docs/youth-risk/oy-cross-patterns-v1.js
          node --check docs/youth-risk/oy-deep-interpretation-v1.js
          node --check docs/youth-risk/oy-narrative-interpretation-v1.js
          node --check docs/youth-risk/oy-scale-figures-v1.js
          node --check docs/youth-risk/oy-ask-model-v1.js
          node --check docs/youth-risk/oy-ask-panel-v1.js
      - name: Verify 1200 synthetic cases and invariants
        run: node --test tests/oy-model-contract.test.cjs
      - name: Verify completed evaluation can open stages 3 and 4
        run: node tests/youth-stage-navigation-regression.cjs
      - name: Verify five-level index with 4000 synthetic cases
        run: node tests/youth-five-level-index.cjs
      - name: Verify V3 narrative and family diagram
        run: node tests/youth-third-revision-regression.cjs
      - name: Verify practitioner result readout explains without changing results
        run: node tests/youth-result-readout.cjs
      - name: Verify architecture wiring and guide documentation
        run: node tests/oy-architecture-wiring.cjs

      - name: Verify narrative export privacy and common reports
        run: |
          node tests/youth-narrative-export-privacy.cjs
          node tests/common-scale-report.cjs
          node tests/oy-deep-interpretation.cjs
          node tests/oy-interpretation-hypothesis-wording.cjs
          node tests/oy-ask-model.cjs
          node tests/oy-narrative-interpretation.cjs
          node tests/youth-narrative-safety-regression.cjs
          node tests/youth-readable-plans.cjs
          node tests/youth-safety-check-plan.cjs
          node tests/oy-scale-figures.cjs
          node tests/oy-paged-report-regression.cjs
          node tests/oy-perspective.cjs
          node tests/youth-eval100-regression.cjs
          node tests/oy-decision-chain.cjs
          node tests/oy-constants-drift.cjs
