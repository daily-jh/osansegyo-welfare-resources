<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">

<title>OY-RALS 의견 관리</title>
<link rel="stylesheet" href="oy-tokens-v12.css?v=20261028-fb1"><link rel="stylesheet" href="oy-feedback-v1.css?v=20261028-fb2">
<style>body{margin:0;background:var(--oy-bg);font-family:'SUIT Variable',system-ui,sans-serif;color:var(--oy-ink)}.fa-wrap{max-width:1000px;margin:0 auto;padding:24px 16px}.fa-login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fa-login input{min-height:44px;padding:0 12px;border:1px solid var(--oy-line);border-radius:10px;font:inherit;flex:1 1 260px}.fa-filter{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.fa-item{background:#fff;border:1px solid var(--oy-line);border-radius:12px;padding:12px 14px;margin:10px 0}.fa-item p{white-space:pre-wrap;line-height:1.6;margin:6px 0}.fa-btns{display:flex;gap:6px;flex-wrap:wrap}.fa-btns button,.fa-filter button,.fa-login button{min-height:40px;padding:0 14px;border:1px solid var(--oy-line);border-radius:999px;background:#fff;font:inherit;cursor:pointer}.fa-filter button[aria-pressed="true"]{background:var(--oy-data-soft);border-color:var(--oy-data)}.fa-tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--oy-core-soft)}.fa-tag.report{background:var(--oy-check-soft);color:var(--oy-check-ink)}.fa-tag.review{background:var(--oy-data-soft);color:var(--oy-data-ink)}</style>

<body><main class="fa-wrap"><h1>OY-RALS 의견 관리</h1>
<p class="oyfb-muted">오류·수정 요청은 여기서만 보입니다. 사용 후기는 '공개'를 눌러야 OY-RALS 화면에 보입니다. 관리 비밀번호는 이 탭에만 잠시 보관되고 탭을 닫으면 지워집니다.</p>
<div class="fa-login"><input type="password" id="faToken" autocomplete="off" aria-label="관리 비밀번호" placeholder="관리 비밀번호(FEEDBACK_ADMIN_TOKEN)"><button type="button" id="faLoad">불러오기</button></div>
<div class="fa-filter" role="group" aria-label="보기"><button type="button" data-f="all" aria-pressed="true">전체</button><button type="button" data-f="report">오류·수정 요청</button><button type="button" data-f="pending">승인 대기 후기</button><button type="button" data-f="approved">공개 중 후기</button></div>
<p id="faStatus" role="status" class="oyfb-muted"></p><div id="faList"></div></main></body></html>
