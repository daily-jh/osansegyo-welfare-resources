<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc">
<title id="title">OY-RALS 평가·해석·지원·점검 구조</title><desc id="desc">25문항과 안전확인 입력은 공통 응답 자료가 됩니다. 통합사례관리 모델은 점수·안전·행정동별 자원·계획을 정리합니다. 한국어 사례해석 모델은 문항·교차 규칙·연구 자료를 참고해 사실·생활 영향·확인 질문·지원 제안을 서술합니다. 두 경로는 결과·리뷰·사례 이해·지원계획에 반영됩니다. 실무자와 학생이 확인·합의한 뒤 실제 실행과 생활변화를 기록하고 재평가합니다. 언어 해석이 점수나 안전 판정을 변경하지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53728b"/></marker></defs>
<rect width="1100" height="880" rx="24" fill="#f3f7fb"/>
<g font-family="Arial, sans-serif" fill="#203c54" text-anchor="middle">
<text x="550" y="42" font-size="25" font-weight="700">한 번의 응답이 지원과 변화 점검으로 이어집니다</text>
<rect x="260" y="68" width="580" height="100" rx="18" fill="white" stroke="#b7cddd"/>
<text x="550" y="100" font-size="21" font-weight="700">① 입력 · 공통 응답 자료</text><text x="550" y="130" font-size="17">25문항 · 점수/미상 · 현재 안전 · 선택한 행정동</text><text x="550" y="153" font-size="15">이름은 후속 분석에 전달하지 않음</text>
<path d="M550 168V190H285V218M550 190H815V218" fill="none" stroke="#53728b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M285 190V218" fill="none" stroke="#53728b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="225" width="430" height="218" rx="20" fill="#e8f0fb" stroke="#7299c0" stroke-width="2"/>
<text x="285" y="260" font-size="22" font-weight="700">② 통합사례관리 지원모델 v2.2</text>
<text x="285" y="300" font-size="18">점수 계산 · 안전 우선 · 미상 보류</text><text x="285" y="332" font-size="18">행정동 → 복지관 권역 → 기관·서비스</text><text x="285" y="364" font-size="18">우선욕구 · 계획 · 의뢰·접수·제공 구분</text><text x="285" y="407" font-size="16">공통 판정 규칙과 현재 자원 DB 사용</text>
<rect x="600" y="225" width="430" height="218" rx="20" fill="#e9f5f0" stroke="#71a494" stroke-width="2"/>
<text x="815" y="260" font-size="22" font-weight="700">③ 한국어 사례해석 v3.0.1</text>
<text x="815" y="300" font-size="18">응답 사실 → 생활 영향 → 확인 질문</text><text x="815" y="332" font-size="18">지원 제안 → 역할 → 변화 점검 서술</text><text x="815" y="364" font-size="18">서술 v2.2 · 추가사정 v3.0.1 · 실행계획 v4.0</text><text x="815" y="407" font-size="16">규칙·근거검색 · 점수·안전 판정 변경 없음</text>
<path d="M285 443V482H815V443" fill="none" stroke="#53728b" stroke-width="3"/><path d="M550 482V510" fill="none" stroke="#53728b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="185" y="518" width="730" height="102" rx="18" fill="white" stroke="#b7cddd"/>
<text x="550" y="553" font-size="22" font-weight="700">④ 공통 근거 1회 · 교사와 사회복지사 실행 역할 구분</text><text x="550" y="584" font-size="18">결과·지원연계 / 공통 리뷰 / 역할별 실행계획 v4.0</text><text x="550" y="607" font-size="15">확인된 응답 · 해석 · 미확인 · 제안을 구분</text>
<path d="M550 620V650" fill="none" stroke="#53728b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="185" y="658" width="730" height="90" rx="18" fill="#fff6e7" stroke="#d5b783"/>
<text x="550" y="691" font-size="22" font-weight="700">⑤ 학생·실무자의 면담과 협의</text><text x="550" y="724" font-size="18">학생의 바람 · 강점 · 실제 상황 확인 → 목표·담당·확인일 합의</text>
<path d="M550 748V776" fill="none" stroke="#53728b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="185" y="784" width="730" height="70" rx="18" fill="white" stroke="#b7cddd"/>
<text x="550" y="813" font-size="21" font-weight="700">⑥ 실행 기록 · 생활변화 점검 · 계획 조정</text><text x="550" y="839" font-size="16">T0~T4 시점·근거 고정 · 실제 접수·제공과 생활변화를 분리</text>
</g></svg>
