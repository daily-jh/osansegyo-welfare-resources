<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">OY-RALS V7.0 모델 연결 구조</title><desc id="desc">기존 CORE 판정을 유지하고 단일 사례정보를 ICSI와 K-CARR에서 검토해 ICMS 실행계획과 현장 기록으로 연결합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#53758e"/></marker></defs><rect width="1000" height="790" rx="24" fill="#f4f8fc"/><g font-family="sans-serif" fill="#23465f" text-anchor="middle"><text x="500" y="40" font-size="23" font-weight="700">OY-RALS V7.0 · 평가와 실제 기록의 연결</text><g fill="white" stroke="#bdcfdd" stroke-width="2"><rect x="55" y="70" width="410" height="80" rx="14"/><rect x="535" y="70" width="410" height="80" rx="14"/><rect x="55" y="198" width="410" height="90" rx="14"/><rect x="535" y="198" width="410" height="90" rx="14"/><rect x="55" y="338" width="410" height="95" rx="14"/><rect x="535" y="338" width="410" height="95" rx="14"/><rect x="55" y="490" width="410" height="90" rx="14"/><rect x="535" y="490" width="410" height="90" rx="14"/><rect x="55" y="640" width="890" height="100" rx="14"/></g><g font-size="19" font-weight="700"><text x="260" y="102">25문항 · 안전확인</text><text x="740" y="102">선택 사례정보 1칸</text><text x="260" y="231">CORE · 기존 평가 엔진</text><text x="740" y="231">NCB · 서술 전달 기반</text><text x="260" y="372">ICSI V7.0 · 문항·교차점수</text><text x="740" y="372">K-CARR V7.0 · 한국어 응답</text><text x="260" y="523">ICMS V7.0 · 사례관리 지원</text><text x="740" y="523">RRA · 기존 복지자원 DB</text><text x="500" y="674">결과·협의안·실행계획 → 실무자 확인·합의 → 실제 기록·변화 점검</text></g><g font-size="15"><text x="260" y="129">0~4점 / 미상 / 별도 안전신호</text><text x="740" y="129">메모리 처리 · 기본 복사·인쇄·백업 제외</text><text x="260" y="258">원점수·미상·안전·지원단계의 유일한 기준</text><text x="740" y="258">시점·출처·부정·가정·미확인 단서</text><text x="260" y="402">상충·같은 사건·독립 근거 대조</text><text x="740" y="402">규칙·카드 검색 · 사실/가설/질문 분리</text><text x="260" y="552">단·장기 목표 / 직무 역할 / 점검 기준</text><text x="740" y="552">행정동·권역·주소·연락처 / 접수 별도 확인</text><text x="500" y="705">문의 ≠ 의뢰 ≠ 접수 ≠ 서비스 시작 ≠ 생활 변화</text><text x="500" y="729">모델은 점수·안전판정·학생 동의·기관 승인·실제 수행을 자동 확정하지 않습니다.</text></g></g><g stroke="#53758e" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M260 150V190"/><path d="M740 150V190"/><path d="M260 288V330"/><path d="M740 288V330"/><path d="M535 260H475V322H285V330"/><path d="M465 385H525"/><path d="M260 433V482"/><path d="M740 433V461H360V482"/><path d="M535 535H475"/><path d="M260 580V632"/></g></svg>
