<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오산 복지자원 지도 실험실</title><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#f5f8fc;color:#15243a}header{padding:26px;background:#173d70;color:white}main{max-width:1100px;margin:auto;padding:20px}input,select,button{font:inherit;padding:12px;border:1px solid #b9c9dc;border-radius:12px}input{width:min(95%,420px)}button{background:#174c89;color:white;cursor:pointer}section{background:white;padding:18px;border-radius:18px;margin:15px 0;box-shadow:0 3px 14px #1232}#map{height:380px;border-radius:14px}.item{padding:12px;border-bottom:1px solid #e5ebf2}.muted{color:#53657a;font-size:14px}a{color:#075da5} .tag{background:#eaf2fd;padding:5px 9px;border-radius:9px;display:inline-block;margin:3px}</style><header><h1>오산 복지자원 지도 · 실험 페이지</h1><p>기존 복지자원 검색과 별개로 운영하는 지도 탐색 기능</p></header><main><p><a href="../">기존 복지자원 홈페이지</a> · <a href="../youth-risk/">기존 위기평가</a></p><section><input id="q" placeholder="기관·서비스·지원분야 검색" aria-label="검색"><select id="category"><option value="">모든 지원분야</option></select><p class="muted">지도 위치는 검색 결과로 추정된 좌표입니다. 공식 주소 검증 전까지 정확한 기관 위치로 간주하지 마세요. 서비스 접수 여부는 반드시 기관에 확인하세요.</p></section><section><div id="map"></div></section><section><strong id="count">불러오는 중</strong><div id="items"></div></section></main><script>function csv(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.length>1)rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}let h=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};let map=L.map('map').setView([37.1498,127.0772],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let pins=L.layerGroup().addTo(map);let all=[];async function load(){try{let s=await fetch('../resources.csv').then(r=>{if(!r.ok)throw Error('데이터 요청 실패');return r.text()});let rows=csv(s),m=new Map();for(let x of rows){let k=x['기관명'];if(!k)continue;if(!m.has(k))m.set(k,{name:k,site:x['홈페이지'],phone:x['대표전화'],services:[],fields:new Set()});let a=m.get(k);a.services.push(x['서비스명']);a.fields.add(x['지원분야'])}all=[...m.values()];let sel=document.getElementById('category');[...new Set(rows.map(x=>x['지원분야']).filter(Boolean))].sort().forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;sel.append(o)});render()}catch(e){document.getElementById('items').textContent='데이터 로드 실패: '+e.message}}function render(){let q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('category').value;let a=all.filter(x=>(!cat||x.fields.has(cat))&&(!q||(x.name+' '+x.services.join(' ')+' '+[...x.fields].join(' ')).toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+'개 기관';document.getElementById('items').innerHTML=a.slice(0,120).map(x=>'<div class="item"><b>'+esc(x.name)+'</b><p>'+esc([...x.fields].join(' · '))+'</p><small>'+esc(x.services.slice(0,5).join(', '))+'</small><p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query='+encodeURIComponent(x.name+' 오산')+'">지도에서 위치 찾기(미검증)</a> · '+(x.site?'<a target="_blank" rel="noopener" href="'+esc(x.site)+'">기관 홈페이지</a>':'')+' '+(x.phone?' · '+esc(x.phone):'')+'</p></div>').join('')||'조건에 맞는 기관이 없습니다'}document.getElementById('q').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);load();</script></html>
