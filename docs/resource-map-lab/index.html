<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오산 복지자원 지도 실험실</title><style>
:root{color-scheme:light;--ink:#17283b;--sub:#65778a;--line:#e6edf4;--accent:#2868a7}
*{box-sizing:border-box}body{background:linear-gradient(160deg,#f5f8fc,#eaf3f6)!important;color:var(--ink)!important;font-family:system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif!important;line-height:1.6}
header{background:linear-gradient(120deg,#123a63,#287b94)!important;padding:42px max(20px,calc((100vw - 1100px)/2))!important;border-radius:0 0 28px 28px}header h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.05em;margin:0 0 8px}header p{opacity:.9}
main{padding:22px 16px 80px!important}section{border:1px solid rgba(224,234,242,.85);background:rgba(255,255,255,.95)!important;border-radius:22px!important;padding:22px!important;box-shadow:0 8px 28px rgba(27,61,90,.055)!important}
section h2{font-size:19px;letter-spacing:-.035em;margin:0 0 12px}input,select{border:1px solid #dbe5ed!important;background:#f9fbfd!important;color:#17283b!important;min-height:46px;max-width:100%;outline-offset:3px}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #84c9ee;outline-offset:2px}
button{border:0!important;border-radius:12px!important;background:#1c658e!important;font-weight:650;min-height:44px;transition:filter .15s}button:hover{filter:brightness(1.08)}button:disabled{opacity:.55}
#map{height:clamp(320px,50vh,540px)!important;border-radius:17px!important;border:1px solid var(--line);z-index:0}.leaflet-container{font-family:inherit}
.item{border-bottom:1px solid var(--line)!important;padding:18px 4px!important}.item:last-child{border-bottom:0!important}.item b{font-size:16px}.item p{margin:7px 0}.muted{color:var(--sub)!important;line-height:1.65}.tag{background:#eff6fa!important;border:1px solid #dceaf1;border-radius:12px!important;margin:5px!important;padding:8px 12px!important;display:inline-flex!important;align-items:center;gap:5px}
.tag input{min-height:auto;width:auto!important;accent-color:#1c658e}a{color:#17618f!important;text-underline-offset:3px}header a{color:#fff!important}
@media(max-width:640px){header{padding:28px 20px!important}section{padding:16px!important;border-radius:17px!important}main{padding:12px 12px 60px!important}#map{height:370px!important}button{margin-top:6px}#q{width:100%!important}select{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#f5f8fc;color:#15243a}header{padding:26px;background:#173d70;color:white}main{max-width:1100px;margin:auto;padding:20px}input,select,button{font:inherit;padding:12px;border:1px solid #b9c9dc;border-radius:12px}input{width:min(95%,420px)}button{background:#174c89;color:white;cursor:pointer}section{background:white;padding:18px;border-radius:18px;margin:15px 0;box-shadow:0 3px 14px #1232}#map{height:380px;border-radius:14px}.item{padding:12px;border-bottom:1px solid #e5ebf2}.muted{color:#53657a;font-size:14px}a{color:#075da5} .tag{background:#eaf2fd;padding:5px 9px;border-radius:9px;display:inline-block;margin:3px}</style><header><h1>오산 복지자원 지도 · 실험 페이지</h1><p>기존 복지자원 검색과 별개로 운영하는 지도 탐색 기능</p></header><main><p><a href="../">기존 복지자원 홈페이지</a> · <a href="../youth-risk/">기존 위기평가</a></p><section><input id="q" placeholder="기관·서비스·지원분야 검색" aria-label="검색"><select id="category"><option value="">모든 지원분야</option></select><p class="muted">지도 위치는 검색 결과로 추정된 좌표입니다. 공식 주소 검증 전까지 정확한 기관 위치로 간주하지 마세요. 서비스 접수 여부는 반드시 기관에 확인하세요.</p></section><section><div id="map"></div></section><section><strong id="count">불러오는 중</strong><div id="items"></div></section></main><script>function csv(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.length>1)rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}let h=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};let map=L.map('map').setView([37.1498,127.0772],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let pins=L.layerGroup().addTo(map);let all=[];async function load(){try{let s=await fetch('../resources.csv').then(r=>{if(!r.ok)throw Error('데이터 요청 실패');return r.text()});let rows=csv(s),m=new Map();for(let x of rows){let k=x['기관명'];if(!k)continue;if(!m.has(k))m.set(k,{name:k,site:x['홈페이지'],phone:x['대표전화'],services:[],fields:new Set()});let a=m.get(k);a.services.push(x['서비스명']);a.fields.add(x['지원분야'])}all=[...m.values()];let sel=document.getElementById('category');[...new Set(rows.map(x=>x['지원분야']).filter(Boolean))].sort().forEach(x=>{let o=document.createElement('option');o.value=o.textContent=x;sel.append(o)});render()}catch(e){document.getElementById('items').textContent='데이터 로드 실패: '+e.message}}function render(){let q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('category').value;let a=all.filter(x=>(!cat||x.fields.has(cat))&&(!q||(x.name+' '+x.services.join(' ')+' '+[...x.fields].join(' ')).toLowerCase().includes(q)));document.getElementById('count').textContent=a.length+'개 기관';document.getElementById('items').innerHTML=a.slice(0,120).map(x=>'<div class="item"><b>'+esc(x.name)+'</b><p>'+esc([...x.fields].join(' · '))+'</p><small>'+esc(x.services.slice(0,5).join(', '))+'</small><p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query='+encodeURIComponent(x.name+' 오산')+'">지도에서 위치 찾기(미검증)</a> · '+(x.site?'<a target="_blank" rel="noopener" href="'+esc(x.site)+'">기관 홈페이지</a>':'')+' '+(x.phone?' · '+esc(x.phone):'')+'</p></div>').join('')||'조건에 맞는 기관이 없습니다'}document.getElementById('q').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);load();</script><script>
(function(){
const base='../contacts.csv';
function parseCSV(s){let out=[],r=[],v='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted;}else if(c===','&&!quoted){r.push(v);v='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);if(r.length>1)out.push(r);r=[];v='';}else v+=c;}if(r.length||v){r.push(v);out.push(r);}const h=(out.shift()||[]).map(x=>x.replace(/^\uFEFF/,''));return out.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])));}
function norm(s){return (s||'').replace(/[^0-9]/g,'');}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));}
fetch(base).then(r=>r.ok?r.text():Promise.reject('연락처 파일 오류')).then(s=>{
 const contacts=parseCSV(s), byPhone=new Map();
 contacts.forEach(c=>{let k=norm(c.phone);if(k.length>=9&&c.address&&c.address_status!=='미확인'){if(!byPhone.has(k))byPhone.set(k,[]);byPhone.get(k).push(c);}});
 const panel=document.createElement('section');panel.innerHTML='<h2>검증 주소 연계</h2><p class="muted">기존 연락처 데이터의 전화번호가 정확히 일치하는 기관만 주소를 표시합니다. 좌표는 별도로 검증되지 않았으며, 지도 검색 결과를 확인해야 합니다.</p><div id="verified-addresses"></div>';
 document.querySelector('main').append(panel);
 function refresh(){if(typeof all==='undefined'||!Array.isArray(all))return;let q=document.getElementById('q')?.value?.toLowerCase()||'',cat=document.getElementById('category')?.value||'';let items=all.filter(x=>(!q||(x.name+' '+(x.services||[]).join(' ')).toLowerCase().includes(q))&&(!cat||x.fields?.has(cat)));let verified=items.map(x=>({x,match:byPhone.get(norm(x.phone))||[]})).filter(z=>z.match.length===1);document.getElementById('verified-addresses').innerHTML='<p>'+verified.length+'개 기관의 주소가 전화번호 기준으로 연결되었습니다.</p>'+verified.slice(0,80).map(({x,match})=>{let c=match[0];return '<div class="item"><b>'+safe(x.name)+'</b><p>'+safe(c.address)+'</p><small>주소 상태: '+safe(c.address_status)+' · 검토일: '+safe(c.address_checked_on)+'</small><p><a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/search?query='+encodeURIComponent(c.address)+'">주소로 지도 검색</a></p></div>'}).join('');}
document.getElementById('q').addEventListener('input',refresh);document.getElementById('category').addEventListener('change',refresh);setTimeout(refresh,900);window.addEventListener('load',refresh);
}).catch(e=>{let p=document.createElement('p');p.textContent='주소 데이터 연결 실패: '+e;document.querySelector('main').append(p)});
})();
</script><script>
/* V3: explicit user-triggered address geocoding; no background bulk geocoding */
(function(){
const panel=document.createElement('section');
panel.innerHTML='<h2>주소 기반 지도 마커 (시범)</h2><p class="muted">주소 검색은 사용자가 선택한 기관 1건만 OpenStreetMap Nominatim에 요청합니다. 좌표는 검색 결과이며 공식 위치 인증이 아닙니다. 검색 실패 시 마커를 생성하지 않습니다.</p><label for="geo-address">기관 주소</label><input id="geo-address" placeholder="검증된 주소 목록에서 주소를 복사해 입력"><button id="geo-search">선택 주소 지도 표시</button><p id="geo-status" aria-live="polite"></p>';
document.querySelector('main').append(panel);
const btn=document.getElementById('geo-search'),status=document.getElementById('geo-status');
btn.addEventListener('click',async()=>{
const address=document.getElementById('geo-address').value.trim();if(address.length<8){status.textContent='정확한 도로명 주소를 입력해 주세요.';return}
btn.disabled=true;status.textContent='주소 검색 중입니다.';
try{const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('q',address);u.searchParams.set('format','jsonv2');u.searchParams.set('limit','1');u.searchParams.set('countrycodes','kr');
const res=await fetch(u.toString(),{headers:{Accept:'application/json'}});if(!res.ok)throw Error('지오코딩 서비스 응답 오류');const data=await res.json();if(!data.length)throw Error('주소 검색 결과 없음');const p=data[0],lat=Number(p.lat),lon=Number(p.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw Error('좌표 오류');
if(typeof map==='undefined'||typeof pins==='undefined')throw Error('지도 준비 중');
pins.clearLayers();L.marker([lat,lon]).addTo(pins).bindPopup(document.createTextNode(address)).openPopup();map.setView([lat,lon],16);status.textContent='검색 좌표를 표시했습니다. 실제 기관 위치와 일치하는지 확인해 주세요.';
}catch(e){status.textContent='마커를 표시하지 않았습니다: '+e.message}finally{btn.disabled=false}
});
document.addEventListener('click',e=>{const a=e.target.closest('#verified-addresses a');if(!a)return;const item=a.closest('.item');const p=item?.querySelector('p');if(p)document.getElementById('geo-address').value=p.textContent.trim();});
})();
</script></html>
